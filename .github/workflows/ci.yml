name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Pull requests share one group per branch, so a new push cancels the superseded run. Pushes to
  # main get one group per commit, so no commit on main loses its result.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Git hooks are for local commits only.
  HUSKY: "0"

# One job per check so each shows as its own status on the pull request and they run in parallel.
# Actions are pinned to commit SHAs; Dependabot keeps them current. Shared setup lives in
# .github/actions/setup.
jobs:
  lint:
    name: 🧹 Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check

  typecheck:
    name: 🔎 Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  tokens:
    name: 🎨 Tokens
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Generated tokens up to date
        run: pnpm tokens:check

  test:
    name: 🃏 Jest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test:ci

  build:
    name: ⚙️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Bundles the app for every platform; fails on any import or transform error.
      - name: Export iOS, Android and web bundles
        run: pnpm exec expo export --platform ios --platform android --platform web --output-dir dist

  storybook:
    name: 📚 Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The catalog is a separate app root behind this flag; its bundle must build too.
      - name: Export the Storybook bundle
        run: pnpm exec expo export --platform ios --output-dir dist-storybook
        env:
          EXPO_PUBLIC_STORYBOOK_ENABLED: "true"
