name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Pull requests share one group per branch, so a new push cancels the superseded run. Pushes to
  # main get one group per commit, so no commit on main loses its result.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Git hooks are for local commits only.
      HUSKY: "0"
    # Actions are pinned to commit SHAs; Dependabot keeps them current.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Generated tokens up to date
        run: pnpm tokens:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:ci
