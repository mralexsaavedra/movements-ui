name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Git hooks are for local commits only.
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Generated tokens up to date
        run: pnpm tokens:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:ci
