# These exact versions are Expo SDK 57 packages that were published inside pnpm's
# minimumReleaseAge cooldown window. They are exempted only so the SDK-pinned
# versions can install; remove each entry once it ages past the window.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.28'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-modules-autolinking@57.0.14
  - expo-modules-core@57.0.21
  - expo@57.0.27
nodeLinker: hoisted
# esbuild (pulled in by Storybook's config loader) ships its binary through optional platform
# packages, so its postinstall check is not needed.
allowBuilds:
  esbuild: false
